<!DOCTYPE html>
<html>
<head>
    <title>Debug JS Loading</title>
    <script src="global.js"></script>
</head>
<body>
    <h1>Debug JavaScript Loading</h1>
    <p>Open the browser console to see debug information.</p>
    
    <div class="file-upload-area">
        <p>Test file upload area</p>
        <input type="file" multiple>
        <div class="file-upload-preview"></div>
    </div>
    
    <button id="test-notification">Test Notification</button>
    <button id="test-ajax">Test AJAX Function</button>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Debug page loaded');
            
            // Check if global functions exist
            console.log('initializeGlobalScripts:', typeof initializeGlobalScripts);
            console.log('showNotification:', typeof showNotification);
            console.log('ajaxRequest:', typeof ajaxRequest);
            
            // Test notification
            document.getElementById('test-notification').addEventListener('click', function() {
                if (typeof showNotification === 'function') {
                    showNotification('Test notification from debug page!', 'success');
                } else {
                    console.log('showNotification function not available');
                }
            });
            
            // Test AJAX function
            document.getElementById('test-ajax').addEventListener('click', function() {
                if (typeof ajaxRequest === 'function') {
                    console.log('ajaxRequest function is available');
                } else {
                    console.log('ajaxRequest function not available');
                }
            });
        });
    </script>
</body>
</html>
