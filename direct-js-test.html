<!DOCTYPE html>
<html>
<head>
    <title>Direct JS Test</title>
</head>
<body>
    <h1>Direct JavaScript Test</h1>
    <p>This page directly loads global.js to test if it works.</p>
    
    <script src="global.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Direct JS test page loaded');
            
            // Test if global functions are available
            if (typeof initializeGlobalScripts === 'function') {
                console.log('✓ initializeGlobalScripts is available');
            } else {
                console.log('✗ initializeGlobalScripts is NOT available');
            }
            
            if (typeof showNotification === 'function') {
                console.log('✓ showNotification is available');
                showNotification('Direct JS test successful!', 'success');
            } else {
                console.log('✗ showNotification is NOT available');
            }
            
            if (typeof ajaxRequest === 'function') {
                console.log('✓ ajaxRequest is available');
            } else {
                console.log('✗ ajaxRequest is NOT available');
            }
        });
    </script>
</body>
</html>
