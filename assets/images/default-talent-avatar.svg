<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Circular clip path for 100% perfect clipping -->
    <clipPath id="circleClip">
      <circle cx="250" cy="250" r="240" />
    </clipPath>
    
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161622" />
      <stop offset="50%" stop-color="#1f1f2e" />
      <stop offset="100%" stop-color="#0d0d14" />
    </linearGradient>
    
    <linearGradient id="avatarGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#df1d3d" />
      <stop offset="100%" stop-color="#e6b749" />
    </linearGradient>

    <radialGradient id="ambientGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#df1d3d" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#e6b749" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Main Avatar Group Clipped to Perfect Circle -->
  <g clip-path="url(#circleClip)">
    <!-- Dark Background -->
    <rect width="500" height="500" fill="url(#bgGradient)" />
    
    <!-- Ambient Radial Glow -->
    <rect width="500" height="500" fill="url(#ambientGlow)" />
    
    <!-- Head -->
    <circle cx="250" cy="180" r="75" fill="url(#avatarGradient)" />

    <!-- Smooth Shoulders / Body Silhouette -->
    <path d="M 80 460 C 80 340, 160 300, 250 300 C 340 300, 420 340, 420 460 Z" fill="url(#avatarGradient)" opacity="0.95" />
  </g>

  <!-- Border Ring -->
  <circle cx="250" cy="250" r="238" fill="none" stroke="url(#avatarGradient)" stroke-width="6" opacity="0.8" />
</svg>
